<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>跳转确认</title>
  <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fa;
      --card: #ffffff;
      --border: #e3e8f0;
      --text: #16191f;
      --text-dim: #6b7382;
      --text-faint: #98a0ad;
      --accent: #2f6df6;
      --accent-active: #2459d0;
      --accent-on: #ffffff;
      --icon-bg: #eef4ff;
      --block-bg: #f8fafc;
      --block-border: #d5dbe6;
      --shadow: 0 6px 24px -12px rgba(22, 25, 31, 0.14);
      --empty-bg: #f3f4f6;
      --empty-fg: #9aa1ad;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0d13;
        --card: #141922;
        --border: #242c39;
        --text: #e8eefb;
        --text-dim: #97a3b8;
        --text-faint: #64708a;
        --accent: #5b9bff;
        --accent-active: #7db1ff;
        --accent-on: #08111f;
        --icon-bg: rgba(91, 155, 255, 0.14);
        --block-bg: rgba(255, 255, 255, 0.045);
        --block-border: #2c3542;
        --shadow: 0 6px 24px -12px rgba(0, 0, 0, 0.55);
        --empty-bg: rgba(255, 255, 255, 0.06);
        --empty-fg: #8b93a3;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
                   "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px 26px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      text-align: center;
      box-shadow: var(--shadow);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .icon {
      width: 46px;
      height: 46px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--icon-bg);
      color: var(--accent);
      font-size: 22px;
      line-height: 46px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .title {
      margin: 0 0 10px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .domain {
      display: block;
      margin: 0 0 22px;
      padding: 11px 14px;
      border: 1px dashed var(--block-border);
      border-radius: 10px;
      background: var(--block-bg);
      color: var(--accent);
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 13.5px;
      word-break: break-all;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-on);
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn:active {
      background: var(--accent-active);
      transform: scale(0.985);
    }

    .note {
      margin: 16px 0 0;
      color: var(--text-faint);
      font-size: 12px;
    }

    .empty .icon {
      background: var(--empty-bg);
      color: var(--empty-fg);
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <div class="icon" id="icon">→</div>
    <h1 class="title" id="title">链接不存在</h1>
    <p class="lead" id="lead">该跳转链接无效或已失效</p>
    <code class="domain" id="domain" hidden></code>
    <button class="btn" id="btn" hidden>继续前往</button>
    <p class="note" id="note" hidden>即将离开本站，请在新的页面中完成操作</p>
  </div>

  <script>
    var TARGETS = {
      psy: {
        title: "心理咨询预约",
        url: "https://www.psy.com.cn/m/vant/#/school/322525/student/login"
      },
      pano: {
        title: "全景地图",
        url: "https://8b2fecdr1.wasee.com/wt/8b2fecdr1"
      }
    };

    function getParam(name) {
      var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(window.location.search);
      return m ? decodeURIComponent(m[1]) : "";
    }

    function getHost(url) {
      var a = document.createElement("a");
      a.href = url;
      return a.hostname;
    }

    var key = getParam("to");
    var item = Object.prototype.hasOwnProperty.call(TARGETS, key) ? TARGETS[key] : null;

    var card = document.getElementById("card");
    var icon = document.getElementById("icon");
    var title = document.getElementById("title");
    var lead = document.getElementById("lead");
    var domain = document.getElementById("domain");
    var btn = document.getElementById("btn");
    var note = document.getElementById("note");

    if (!item) {
      card.className = "card empty";
      icon.textContent = "!";
      title.textContent = "链接不存在";
      lead.textContent = "该跳转链接无效或已失效";
    } else {
      document.title = item.title;
      title.textContent = item.title;
      lead.textContent = "你即将前往以下站点";
      domain.textContent = getHost(item.url);
      domain.hidden = false;
      btn.textContent = "前往 " + getHost(item.url);
      btn.hidden = false;
      note.hidden = false;
      btn.onclick = function () {
        window.location.href = item.url;
      };
    }
  </script>
</body>
</html>
